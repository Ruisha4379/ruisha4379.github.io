name: Codex Auto Content Update

on:
  schedule:
    - cron: "0 2 * * *"   # runs daily
  workflow_dispatch:      # allows manual run

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            You are updating a personal website.

            TASK:
            - Improve or add a small update to the homepage or blog
            - Keep it professional and concise
            - Do not break layout or styling

      - name: Commit changes
        run: |
          git config user.name "codex-bot"
          git config user.email "codex@users.noreply.github.com"
          git add .
          git commit -m "Auto update via Codex" || echo "No changes"
          git push
