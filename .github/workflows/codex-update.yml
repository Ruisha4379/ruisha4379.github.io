name: Auto Update Website with AI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate update using OpenAI API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          RESPONSE=$(curl -s https://api.openai.com/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{
              "model": "gpt-4.1-mini",
              "input": "You are updating a personal website. Write a short new blog section about energy systems or AI in energy policy. Keep it concise."
            }')

          echo "$RESPONSE" > response.json

      - name: Apply update to file
        run: |
          echo "AI output saved. You can later parse and insert into blog.md or index.html"

      - name: Commit changes
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@users.noreply.github.com"
          git add .
          git commit -m "AI update" || echo "No changes"
          git push
